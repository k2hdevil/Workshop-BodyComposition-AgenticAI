AWSTemplateFormatVersion: "2010-09-09"

Description: >
  체성분 분석 Agentic AI Workshop — 추출 도구 + AgentCore Gateway (선택 스택)

  Gateway 의 Lambda 타겟을 사용합니다. 이 방식에서는 Lambda 가 MCP 프로토콜을 몰라도
  Gateway 가 MCP 를 대신 처리합니다. 그래서 컨테이너 / ECR / CodeBuild / ARM64 MCP
  서버가 전혀 필요하지 않습니다.

  이 스택은 선택입니다. 배포하지 않아도 Lab 1 은 Runtime 내부 추출 경로로 진행됩니다.
  (Lab 1 은 Gateway 경유 -> 실패 시 in-process 순서로 폴백합니다)

  선행 조건: 01-core.yaml 스택이 먼저 배포되어 있어야 합니다.

  배포:
    aws cloudformation deploy \
      --template-file infra/02-gateway.yaml \
      --stack-name bca-workshop-gateway \
      --parameter-overrides CoreStackName=bca-workshop-core \
      --capabilities CAPABILITY_NAMED_IAM \
      --region us-east-1

Metadata:
  # cfn-lint 1.55 시점의 번들 스키마에는 AgentCore 리소스가 아직 없습니다.
  # 46개 리전 폴더 전체에 aws-bedrockagentcore-* 스키마가 존재하지 않아서
  # 아래 두 규칙이 오탐으로 발생합니다.
  #
  #   E3006  Resource type 'AWS::BedrockAgentCore::Gateway' does not exist
  #   W3037  'bedrock-agentcore' is not a known IAM action prefix
  #
  # 리소스 타입과 속성은 AWS CloudFormation 템플릿 레퍼런스 기준으로 작성했습니다.
  #   https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/AWS_BedrockAgentCore.html
  #
  # 주의: 이 때문에 Gateway / GatewayTarget 블록은 린터가 검증해 주지 못합니다.
  #       최초 배포 시 속성 오류가 스택 생성 단계에서 드러날 수 있습니다.
  cfn-lint:
    config:
      ignore_checks:
        - E3006
        - W3037

# ──────────────────────────────────────────────
Parameters:

  ProjectName:
    Type: String
    Default: bca-workshop
    AllowedPattern: "^[a-z][a-z0-9-]{2,20}$"
    Description: 리소스 이름 접두사 (01-core.yaml 과 동일하게 유지하세요)

  CoreStackName:
    Type: String
    Default: bca-workshop-core
    Description: >
      01-core.yaml 로 배포한 스택 이름. S3 버킷과 Cognito 값을 여기서 가져옵니다.

# ──────────────────────────────────────────────
Resources:

  # ── 추출 Lambda ─────────────────────────────
  # 실습에서 참가자가 코드를 작성해 교체합니다. 여기서는 배포 가능한 최소 코드만
  # 넣어두고 IAM / Gateway / 도구 스키마 배선을 미리 완성해 둡니다.
  #
  # 역할 분담:
  #   이 Lambda      : pdfplumber 로 텍스트 레이어 파싱 (순수 Python, 네이티브 의존성 없음)
  #   Runtime 에이전트 : 파싱 실패 시 Claude 비전으로 폴백 (스캔본 처리)
  # 그래서 이 Lambda 에는 Bedrock 권한을 주지 않습니다.
  ExtractorFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-extractor-lambda-role"
      # IAM Description 은 ASCII/Latin-1 만 허용합니다 (한글은 배포 실패).
      Description: Body composition sheet extractor Lambda execution role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-extractor:*"
        - PolicyName: read-measurements
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # 결과지 읽기 전용. 쓰기 권한은 주지 않습니다.
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${Bucket}/*"
                    - Bucket:
                        Fn::ImportValue: !Sub "${CoreStackName}-DataBucketName"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ExtractorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-extractor"
      RetentionInDays: 7

  ExtractorFunction:
    Type: AWS::Lambda::Function
    DependsOn: ExtractorLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-extractor"
      Description: Body composition sheet extractor (replaced by participants in Lab 1)
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt ExtractorFunctionRole.Arn
      Timeout: 60
      MemorySize: 1024
      Environment:
        Variables:
          DATA_BUCKET:
            Fn::ImportValue: !Sub "${CoreStackName}-DataBucketName"
      Code:
        ZipFile: |
          """
          자리표시자 핸들러입니다. Lab 1 에서 실제 추출 코드로 교체합니다.

          Gateway 는 MCP 도구 호출을 이 함수의 이벤트로 전달합니다.
          호출된 도구 이름은 Lambda 컨텍스트의 client_context 에 담겨 오므로,
          도구가 여러 개일 때는 그 값으로 분기합니다.
          """
          import json


          def handler(event, context):
              tool_name = None
              cc = getattr(context, "client_context", None)
              if cc is not None and getattr(cc, "custom", None):
                  tool_name = cc.custom.get("bedrockAgentCoreToolName")

              return {
                  "status": "NOT_IMPLEMENTED",
                  "message": (
                      "자리표시자입니다. Lab 1 에서 pdfplumber 추출 코드로 교체하세요."
                  ),
                  "received_tool": tool_name,
                  "received_event": event,
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── Gateway 실행 역할 ────────────────────────
  # Gateway 가 Lambda 를 호출할 때 사용합니다.
  # 타겟에서 CredentialProviderType: GATEWAY_IAM_ROLE 로 지정하면 이 역할이 쓰입니다.
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-gateway-role"
      Description: AgentCore Gateway execution role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-extractor
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ExtractorFunction.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── AgentCore Gateway ───────────────────────
  # 인바운드 인증을 Cognito JWT 로 검증합니다. Streamlit 이 st.login() 으로 받은
  # ID 토큰을 그대로 넘기면 Gateway 가 검증합니다.
  Gateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: !Sub "${ProjectName}-tools"
      Description: Body composition sheet tool gateway
      RoleArn: !GetAtt GatewayRole.Arn
      ProtocolType: MCP
      AuthorizerType: CUSTOM_JWT
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl:
            Fn::Sub:
              - "https://cognito-idp.${AWS::Region}.amazonaws.com/${PoolId}/.well-known/openid-configuration"
              - PoolId:
                  Fn::ImportValue: !Sub "${CoreStackName}-UserPoolId"
          AllowedClients:
            - Fn::ImportValue: !Sub "${CoreStackName}-UserPoolClientId"
      Tags:
        Project: !Ref ProjectName

  # ── Gateway 타겟 — Lambda 를 MCP 도구로 노출 ──
  # 여기가 이 스택의 핵심입니다. Lambda 는 MCP 를 구현하지 않습니다.
  # 아래 ToolSchema 가 곧 에이전트에게 보이는 도구 정의이며, Gateway 가
  # MCP tools/list 와 tools/call 을 대신 처리해 Lambda 를 호출합니다.
  ExtractorTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !Ref Gateway
      Name: bodyCompositionExtractor
      Description: Extracts measurements from a body composition sheet PDF
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
      TargetConfiguration:
        Mcp:
          Lambda:
            LambdaArn: !GetAtt ExtractorFunction.Arn
            ToolSchema:
              InlinePayload:
                - Name: extract_body_composition
                  Description: >-
                    S3 에 저장된 체성분 분석 결과지 PDF 에서 측정값을 추출하여
                    정규화된 JSON 으로 반환합니다. 텍스트 레이어가 없는 스캔본은
                    추출에 실패하고 status=NO_TEXT_LAYER 를 반환하므로,
                    호출한 쪽에서 비전 모델로 폴백해야 합니다.
                  InputSchema:
                    Type: object
                    Properties:
                      s3_key:
                        Type: string
                        Description: >-
                          버킷 내 결과지 객체 키.
                          예) measurements/user-a-session-03.pdf
                      bucket:
                        Type: string
                        Description: >-
                          결과지가 있는 S3 버킷. 생략하면 환경변수 DATA_BUCKET 을 씁니다.
                    Required:
                      - s3_key
                  OutputSchema:
                    Type: object
                    Description: 정규화된 체성분 측정값 또는 추출 실패 상태
                    Properties:
                      status:
                        Type: string
                        Description: OK 또는 NO_TEXT_LAYER 또는 VALIDATION_FAILED
                      document_id:
                        Type: string
                      measurement:
                        Type: object
                        Description: >-
                          체성분 분석 / 골격근·지방 분석 / 비만 분석 /
                          부위별 근육 분석 4개 섹션의 측정값
                      validation_errors:
                        Type: array
                        Description: 산수 검증에 실패한 항목 목록
                        Items:
                          Type: string

# ──────────────────────────────────────────────
Outputs:

  GatewayUrl:
    Description: MCP 엔드포인트. 에이전트의 MCP 클라이언트가 이 URL 로 접속합니다.
    Value: !GetAtt Gateway.GatewayUrl
    Export:
      Name: !Sub "${AWS::StackName}-GatewayUrl"

  GatewayIdentifier:
    Description: Gateway 식별자
    Value: !GetAtt Gateway.GatewayIdentifier

  GatewayStatus:
    Description: Gateway 상태 (READY 여야 호출 가능)
    Value: !GetAtt Gateway.Status

  ExtractorFunctionName:
    Description: 추출 Lambda 함수 이름
    Value: !Ref ExtractorFunction
    Export:
      Name: !Sub "${AWS::StackName}-ExtractorFunctionName"

  UpdateFunctionCodeCommand:
    Description: >
      Lab 1 에서 작성한 추출 코드를 배포하는 명령.
      pdfplumber 를 포함해 zip 을 만든 뒤 실행합니다.
    Value: !Sub >-
      aws lambda update-function-code
      --function-name ${ExtractorFunction}
      --zip-file fileb://extractor.zip
      --region ${AWS::Region}

  BuildZipCommand:
    Description: 추출 Lambda 배포 패키지 생성 (arm64 휠로 pdfplumber 설치)
    Value: >-
      pip install pdfplumber -t build/ --platform manylinux2014_aarch64
      --only-binary=:all: --python-version 3.13 &&
      cp index.py build/ && cd build && zip -qr ../extractor.zip . && cd ..
